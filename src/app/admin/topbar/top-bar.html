<header class="topbar">
  <div class="topbar-inner">

    <div class="topbar-left">
      <button class="menu-btn" type="button" aria-label="Open admin menu" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="topbar-title">
        <span class="badge-tag">Admin Portal</span>
        <a routerLink="/" class="live-link" title="View Live Website" target="_blank" rel="noopener">
          <span>View Site</span>
          <svg viewBox="0 0 24 24" fill="none" width="12" height="12" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" width="19" height="19" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="dot"></span>
      </button>

      <div class="admin-chip" (click)="toggleAccountMenu(); $event.stopPropagation()">
        <span class="avatar">{{ adminInitial }}</span>
        <div class="chip-text">
          <strong>{{ admin()?.name }}</strong>
          <span>{{ admin()?.role }}</span>
        </div>
        <svg class="chip-chevron" [class.is-open]="accountMenuOpen" viewBox="0 0 24 24" fill="none" width="14" height="14" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <div class="account-menu" *ngIf="accountMenuOpen">
          <div class="account-menu-head">
            <strong>{{ admin()?.name }}</strong>
            <span>{{ admin()?.email }}</span>
          </div>
          <button class="account-menu-item" type="button" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true">
              <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</header>
