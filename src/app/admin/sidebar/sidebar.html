<div class="sidebar-backdrop" [class.is-open]="sidebarOpen" (click)="closeSidebar()"></div>

<aside class="sidebar" [class.is-open]="sidebarOpen">
  <div class="brand">
    <span class="brand-mark">AKT</span>
    <div class="brand-text">
      <strong>AKT Travels</strong>
      <span>Admin Panel</span>
    </div>
  </div>

  <nav class="nav" aria-label="Admin">
    <a
      class="nav-item"
      routerLink="/admin/dashboard"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{exact: true}"
      (click)="closeSidebar()"
    >
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Dashboard</span>
    </a>

    <div class="nav-group">
      <button
        class="nav-item nav-group-toggle"
        type="button"
        (click)="toggleBlogMenu()"
        [class.is-active]="blogMenuOpen"
        [attr.aria-expanded]="blogMenuOpen"
        aria-controls="blog-submenu"
      >
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Blog Management</span>
        <svg class="chevron" [class.is-open]="blogMenuOpen" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div id="blog-submenu" class="nav-submenu" [class.is-open]="blogMenuOpen">
        <a class="nav-subitem" routerLink="/admin/dashboard/blogs" routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()">All Blogs</a>
        <a class="nav-subitem" routerLink="/admin/dashboard/blogs/add" routerLinkActive="is-active" (click)="closeSidebar()">Add Blog</a>
      </div>
    </div>
  </nav>

  <button class="logout-btn" type="button" (click)="logout()">
    <svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Logout</span>
  </button>
</aside>
