<main class="login">
  <div class="login__card">
    <div class="login__scene" aria-hidden="true">
      <div class="login__scene-overlay"></div>

      <div class="login__scene-content">
        <p class="login__eyebrow">Explore the coast</p>
        <h2 class="login__scene-title">
          AKT TRAVELS
          <span>Your journey begins here</span>
        </h2>
      </div>
    </div>

    <section class="login__panel" aria-label="Log in to AKT Travels">
      <a class="login__brand" href="/" aria-label="AKT Travels home">
        <span class="login__brand-mark">AKT</span><span class="login__brand-name">Travels</span>
      </a>

      <h1 class="login__title">Log In</h1>
      <p class="login__subtitle">Welcome back - sign in to manage your bookings.</p>

      <form #loginForm="ngForm" class="login__form" (ngSubmit)="onSubmit(loginForm)" novalidate>
        <label class="login__field" for="email">
          <svg viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 3L10 9L18 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="e-mail"
            autocomplete="username"
            required
            [(ngModel)]="email"
          />
        </label>

        <label class="login__field" for="password">
          <svg viewBox="0 0 18 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="9" width="12" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5.5 9V6C5.5 3.5 7 1.7 9 1.7C11 1.7 12.5 3.5 12.5 6V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="password"
            autocomplete="current-password"
            required
            minlength="6"
            [(ngModel)]="password"
          />
          <button
            type="button"
            class="login__toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 1L19 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M1 7C1 7 4.5 1.5 10 1.5C12 1.5 13.6 2.3 14.9 3.3M19 7C19 7 15.5 12.5 10 12.5C8.6 12.5 7.3 12.1 6.2 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="10" cy="7" r="2.6" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            } @else {
              <svg viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 7C1 7 4.5 1.5 10 1.5C15.5 1.5 19 7 19 7C19 7 15.5 12.5 10 12.5C4.5 12.5 1 7 1 7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="7" r="2.6" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            }
          </button>
        </label>

        @if (formError()) {
          <p class="login__error">Please enter a valid e-mail and password (6+ characters).</p>
        }

        <div class="login__row-between">
          <label class="login__remember">
            <input type="checkbox" name="remember" [(ngModel)]="remember" />
            Remember me
          </label>
          <a class="login__forgot" href="#">Forgot password?</a>
        </div>

        <button class="login__submit" type="submit">Log In</button>
      </form>
    </section>
  </div>
</main>
