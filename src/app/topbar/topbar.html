<div class="topbar">
  <div class="topbar__inner">

    <!-- Address -->
    <div class="topbar__address">
      <span class="topbar__icon topbar__icon--map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <span class="topbar__address-track">
        <span class="topbar__address-marquee">
          <span class="topbar__address-text">{{ address }}</span>
          <span class="topbar__address-text" aria-hidden="true">{{ address }}</span>
        </span>
      </span>
    </div>

    <!-- Contact links -->
    <div class="topbar__contact">
      <a
        class="topbar__item topbar__item--phone"
        [href]="'tel:' + phone"
        aria-label="Call us"
      >
        <span class="topbar__icon topbar__icon--phone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
          </svg>
        </span>
        <span class="topbar__text">{{ phoneDisplay }}</span>
      </a>

      <a
        class="topbar__item topbar__item--whatsapp"
        [href]="'https://wa.me/' + whatsappNumber"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Chat on WhatsApp"
      >
        <span class="topbar__icon topbar__icon--whatsapp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21l1.4-3.9a8.5 8.5 0 1 1 3.4 3l-4.8.9Z"/>
            <path d="M8.5 9.5c.3-.6.9-.6 1.2 0l.6 1.2c.15.3.1.6-.1.85l-.4.5a4.6 4.6 0 0 0 2.1 2.1l.5-.4c.25-.2.55-.25.85-.1l1.2.6c.6.3.6.9 0 1.2-1.6.9-3.6.4-5.2-1.2s-2.1-3.6-1.2-5.2Z"/>
          </svg>
        </span>
        <span class="topbar__text">WhatsApp</span>
      </a>

      <a
        class="topbar__item topbar__item--email"
        [href]="'mailto:' + email"
        aria-label="Email us"
      >
        <span class="topbar__icon topbar__icon--email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m2 7 10 6 10-6"/>
          </svg>
        </span>
        <span class="topbar__text">{{ email }}</span>
      </a>
    </div>

  </div>
</div>
